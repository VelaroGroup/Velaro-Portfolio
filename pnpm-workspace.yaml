# This standalone website retains its own locked dependency and build policy.
minimumReleaseAge: 10080
# Reviewed, explicitly pinned Cloudflare deployment toolchain (8 October 2026).
# Keep the seven-day policy for packages outside these exact release versions.
minimumReleaseAgeExclude:
  - '@opennextjs/cloudflare@1.20.9'
  - '@opennextjs/aws@4.1.8'
  - 'wrangler@4.148.0'
  - 'miniflare@5.20261006.0-alpha'
  - 'workerd@1.20261006.1'
  - '@cloudflare/workerd-darwin-64@1.20261006.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261006.1'
  - '@cloudflare/workerd-linux-64@1.20261006.1'
  - '@cloudflare/workerd-linux-arm64@1.20261006.1'
  - '@cloudflare/workerd-windows-64@1.20261006.1'
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# A later project-only session must not mutate a shared-store inode through node_modules.
packageImportMethod: clone-or-copy
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  sharp: 0.35.5
  '@babel/core@<7.29.6': 7.29.6
  'browserslist@<4.28.7': 4.28.7
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'source-map-js@<1.2.2': 1.2.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
